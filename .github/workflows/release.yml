name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 提前拦住一类"CI 报成功、但产物是错的"的情况：
  # 若标签是 v0.2.0 而 package.json 里 version 还是 0.1.0，
  # electron-builder 会用 package.json 的版本命名文件，于是 Release 上挂着
  # v0.2.0 的标题、里面却是 `…-0.1.0-setup.exe` —— 而流水线一路绿灯。
  # 注意：这里不用 `if` 卡整个 job。job 被跳过会导致 needs 它的下游 job 一并被跳过
  # （GitHub Actions 的已知行为），那样 workflow_dispatch 手动验证的路径就废了。
  # 所以让 job 始终运行、只把"检查"这一步条件化。
  guard:
    name: 版本一致性校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签与 package.json 版本一致
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "标签版本 = ${tag}"
          echo "package.json 版本 = ${pkg}"
          if [ "${tag}" != "${pkg}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 package.json 的 version（${pkg}）不一致。请先把 package.json 的 version 改为 ${tag} 并提交，再打标签，否则产出的安装包文件名会带错版本号。"
            exit 1
          fi

  package:
    name: 打包 (${{ matrix.label }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
            artifact: installers-windows
          - os: macos-latest
            label: macOS
            command: npm run dist:mac
            artifact: installers-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 打包
        shell: bash
        # 必须用 bash 且显式 unset：GitHub Actions 对未定义的 secret 会注入**空字符串**，
        # 而 electron-builder 的 getCscLink() 只判 null 不判空（macPackager.js:26），
        # "" 会被 resolveCscLinkPath("", projectDir) 解析成项目目录本身，
        # 抛 `…/markdown-notes not a file`（macOS 必挂；Windows 走 isEmptyOrSpaces 判断，所以不受影响）。
        run: |
          if [ -n "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # 无证书时关闭签名身份探测，省掉无谓的钥匙串搜索与告警噪音
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS 公证（未配置时会跳过，产物为未签名 dmg）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg

  publish:
    name: 发布到 GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    # 这里用 ubuntu-latest 只是挑最省额度的 runner 执行 gh 命令，
    # 不产出任何 Linux 产物 —— 打包只发生在 Windows 与 macOS。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并附带安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # 做成幂等的：重跑同一次失败的工作流时，Release 可能已存在，
        # 此时改为覆盖上传产物，而不是让 `gh release create` 报 "already exists"。
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              artifacts/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              artifacts/*
          fi
